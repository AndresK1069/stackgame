<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Énigme</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 12px; }
    .timer { font-weight: bold; color: #b71c1c; margin-bottom: 10px; }
    .msg { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="timer">Temps restant : <span id="timer">30</span> s</div>
  <h3 id="titre-zone">Zone</h3>
  <p id="question"></p>

  <form id="form-enigme">
    <input type="text" id="reponse" placeholder="Ex: 4 et -3" autocomplete="off" required>
    <button type="submit" id="btn-valider">Valider</button>
    <button type="button" id="btn-retry">Recommencer</button>
  </form>

  <div class="msg" id="message"></div>

  <script>
    const enigmes = {
      ba1: {
        titre: "BA1 - GARROS",
        duree: 30,
        question: "Résous t² - t = 12 (donne les deux solutions, ex: 4 et -3).",
        valider: (val) => {
          const nums = (val.match(/-?\d+/g) || []).map(Number);
          return nums.includes(4) && nums.includes(-3) && new Set(nums).size >= 2;
        }
      },
      ba3: {
        titre: "BA3 - BASTIE",
        duree: 25,
        question: "Combien vaut 3x + 5 quand x = 4 ?",
        valider: (val) => Number(val.trim()) === 17
      },
      ba6: {
        titre: "BA6 - BLERIOT",
        duree: 25,
        question: "Quelle est la racine carrée positive de 144 ?",
        valider: (val) => Number(val.trim()) === 12
      }
    };

    const params = new URLSearchParams(window.location.search);
    const zoneId = enigmes[params.get("zone")] ? params.get("zone") : "ba1";
    const enigme = enigmes[zoneId];

    document.getElementById("titre-zone").textContent = enigme.titre;
    document.getElementById("question").textContent = enigme.question;

    let tempsRestant = enigme.duree;
    let expire = false;
    const timerEl = document.getElementById("timer");
    const msgEl = document.getElementById("message");
    const inputEl = document.getElementById("reponse");
    const btnValider = document.getElementById("btn-valider");

    function lancerTimer() {
      clearInterval(window._intervalEnigme);
      tempsRestant = enigme.duree;
      expire = false;
      btnValider.disabled = false;
      timerEl.textContent = tempsRestant;
      msgEl.textContent = "";

      window._intervalEnigme = setInterval(() => {
        tempsRestant -= 1;
        timerEl.textContent = tempsRestant;
        if (tempsRestant <= 0) {
          clearInterval(window._intervalEnigme);
          expire = true;
          btnValider.disabled = true;
          msgEl.textContent = "Temps écoulé ! Clique sur Recommencer pour réessayer.";
        }
      }, 1000);
    }

    document.getElementById("form-enigme").addEventListener("submit", (e) => {
      e.preventDefault();
      if (expire) return;

      if (enigme.valider(inputEl.value)) {
        clearInterval(window._intervalEnigme);
        btnValider.disabled = true;
        msgEl.textContent = "Bonne réponse ! Zone débloquée.";
        window.parent.postMessage({ type: "enigme_validee", zone: zoneId }, "*");
      } else {
        msgEl.textContent = "Réponse incorrecte, réessaie avant la fin du temps.";
      }
    });

    document.getElementById("btn-retry").addEventListener("click", () => {
      inputEl.value = "";
      lancerTimer();
    });

    lancerTimer();
  </script>
</body>
</html>
