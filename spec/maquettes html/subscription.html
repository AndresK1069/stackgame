<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription - StackGame</title>
  <h1>Page d'inscription</h1>
  <link rel="stylesheet" href="../stylesheet/style.css">
</head>
<body>


<main>
  <form>
    <img src="images/logo.png" alt="Logo StackGame" width="80" height="80" class="center">
    <h2 class="titre">Bienvenue</h2>
    <p class="description">Créer un compte</p>

    <fieldset class="connexion">
      <legend class="sr-only">Informations de compte</legend>

      <label for="email" class="champs">Email</label>
      <input type="email" id="email" class="input" name="email" required>

      <label for="password" class="champs">Mot de passe</label>
      <input type="password" id="password" class="input" name="password" required>

      <label for="code" class="text">Code</label>
      <input type="text" id="code" class="input" name="code">

      <label for="nom" class="champs">Nom</label>
      <input type="text" id="nom" class="input" name="nom">

      <label for="prenom" class="champs">Prénom</label>
      <input type="text" id="prenom" class="input" name="prenom">

      <div>
        <button type="submit" class="classic-button" style="color: #121212;">S'inscrire</button>
      </div>
    </fieldset>
  </form>
</main>

<footer>
  <p>© 2026 StackGame</p>
</footer>

</body>
</html>
